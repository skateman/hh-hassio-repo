name: GitHub Packages Container Registry
on:
  push:
    branches: [ master ]

jobs:
  detect:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v6

      - name: Determine packages to build
        id: changes
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod a+x /usr/local/bin/yq

          echo "$TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Build the matrix of packages that need building
          matrix='{"include":[]}'
          has_changes=false

          for config in */config.yaml; do
            package=$(dirname "$config")
            version=$(yq -r '.version' "$config")

            # Check if the version tag already exists in the registry (using amd64 as reference)
            if docker manifest inspect "ghcr.io/${{ github.repository }}/amd64-${package}:${version}" > /dev/null 2>&1; then
              echo "Package '$package' version '$version' already exists, skipping"
            else
              echo "Package '$package' version '$version' not found in registry, needs build"
              has_changes=true

              for arch in amd64 aarch64; do
                case "$arch" in
                  amd64)   os="ubuntu-24.04" ;;
                  aarch64) os="ubuntu-24.04-arm" ;;
                esac

                image="ghcr.io/${{ github.repository }}/${arch}-${package}"
                matrix=$(jq -c --arg arch "$arch" --arg os "$os" \
                  --arg package "$package" --arg version "$version" \
                  --arg image "$image" \
                  '.include += [{arch: $arch, os: $os, package: $package, version: $version, image: $image}]' <<< "$matrix")
              done
            fi
          done

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "has_changes=${has_changes}" >> "$GITHUB_OUTPUT"
          echo "Build matrix:"
          jq . <<< "$matrix"

  build:
    name: Build ${{ matrix.arch }}/${{ matrix.package }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Build and push image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ${{ matrix.package }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ matrix.version }}
            latest
          push: "true"
          version: ${{ matrix.version }}
          cosign: "false"
